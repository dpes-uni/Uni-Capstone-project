<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assure Docs · Sign Up</title>
    <style>
        /* same as login styles – copy-paste for brevity */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f8fafc; color:#0b1a33; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; }
        a { text-decoration:none; color:inherit; cursor:pointer; }
        :root {
            --primary:#0b2b5c; --primary-light:#1a3f7a; --accent:#2563eb;
            --accent-light:#dbeafe; --gray:#64748b; --gray-light:#f1f5f9;
            --border:#e2e8f0; --white:#ffffff; --shadow:0 4px 24px rgba(0,0,0,0.06);
            --radius:14px; --transition:all 0.25s ease;
        }
        nav { display:flex; align-items:center; justify-content:space-between; padding:0 48px; height:76px; background:var(--white); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1000; backdrop-filter:blur(8px); background:rgba(255,255,255,0.92); }
        .nav-logo { font-size:24px; font-weight:800; color:var(--primary); }
        .nav-logo span { font-weight:300; color:var(--gray); }
        .nav-links { display:flex; list-style:none; gap:6px; }
        .nav-links li a { padding:8px 20px; border-radius:8px; font-size:15px; font-weight:500; color:var(--gray); transition:var(--transition); }
        .nav-links li a:hover { background:var(--gray-light); color:var(--primary); }
        .nav-cta { display:flex; gap:12px; }
        .btn { padding:10px 28px; border-radius:40px; font-size:14px; font-weight:600; border:none; cursor:pointer; transition:var(--transition); display:inline-block; }
        .btn-primary { background:var(--accent); color:var(--white); }
        .btn-primary:hover { background:#1d4ed8; transform:translateY(-2px); box-shadow:0 8px 24px rgba(37,99,235,0.30); }
        .btn-outline { background:transparent; color:var(--primary); border:2px solid var(--border); }
        .btn-outline:hover { background:var(--gray-light); border-color:var(--primary); }
        .auth-container { flex:1; display:flex; justify-content:center; align-items:center; padding:40px 20px; }
        .auth-card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:48px 40px; max-width:440px; width:100%; border:1px solid var(--border); }
        .auth-header { text-align:center; margin-bottom:30px; }
        .auth-header h2 { font-size:28px; font-weight:700; color:#0b1a33; }
        .auth-header p { color:var(--gray); margin-top:6px; }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-weight:600; font-size:14px; margin-bottom:5px; color:#1e293b; }
        .form-group input { width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:8px; font-size:14px; transition:all 0.2s; }
        .form-group input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.15); }
        .btn-auth { width:100%; padding:14px; background:var(--accent); color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-auth:hover { background:#1d4ed8; transform:translateY(-1px); }
        .auth-footer-text { text-align:center; margin-top:24px; font-size:14px; color:var(--gray); }
        .auth-footer-text a { color:var(--accent); font-weight:600; }
        .alert { padding:12px; border-radius:8px; margin-bottom:16px; display:none; }
        .alert.error { display:block; background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; }
        .alert.success { display:block; background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }

        @media (max-width:768px) {
            nav { padding:0 20px; flex-wrap:wrap; height:auto; gap:10px; padding-top:12px; }
            .nav-links { order:3; width:100%; justify-content:center; gap:4px; padding:8px 0; border-top:1px solid var(--border); }
            .nav-links li a { font-size:13px; padding:6px 12px; }
            .nav-cta .btn { padding:6px 14px; font-size:12px; }
            .auth-card { padding:30px 20px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-logo">Assure <span>Docs</span></div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="features.html">Features</a></li>
        <li><a href="verify.html">Verify</a></li>
        <li><a href="assessments.html">Assessments</a></li>
    </ul>
    <div class="nav-cta">
        <a href="login.html" class="btn btn-outline">Log in</a>
        <a href="signup.html" class="btn btn-primary" style="border-color:var(--accent);">Get Started</a>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header"><h2>Create Account</h2><p>Join thousands of satisfied users</p></div>
        <div id="signupAlert" class="alert"></div>
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group"><label>Full Name</label><input type="text" id="signupName" placeholder="John Doe" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="signupEmail" placeholder="you@company.com" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="signupPassword" placeholder="At least 8 characters" required></div>
            <div class="form-group"><label>Confirm Password</label><input type="password" id="signupPassword2" placeholder="Confirm password" required></div>
            <button type="submit" class="btn-auth">Create Account</button>
        </form>
        <div class="auth-footer-text">Already have an account? <a href="login.html">Sign in</a></div>
    </div>
</div>

<script>
    function handleSignup(e) {
        e.preventDefault();
        const alert = document.getElementById('signupAlert');
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const p1 = document.getElementById('signupPassword').value;
        const p2 = document.getElementById('signupPassword2').value;
        if (!name || !email) { alert.className='alert error'; alert.textContent='❌ Please fill in all fields.'; return; }
        if (p1.length < 8) { alert.className='alert error'; alert.textContent='❌ Password must be at least 8 characters.'; return; }
        if (p1 !== p2) { alert.className='alert error'; alert.textContent='❌ Passwords do not match.'; return; }
        alert.className='alert success';
        alert.textContent='✅ Account created! You can now log in.';
        // store name for dashboard
        localStorage.setItem('assure_user', name);
        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    }
</script>

</body>
</html>
